<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCOPE — Light Pop-Art Silkscreen Factory</title>
  <meta name="description" content="SCOPE is a high-contrast light pop-art generative web application inspired by Andy Warhol's Factory aesthetics, CMYK screenprinting, and neo-brutalism.">

  <!-- Non-blocking Google Fonts with instant system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&display=swap">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/tokens-light.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body class="light-theme">
  <!-- App Container for Modular JavaScript Execution -->
  <div id="app"></div>

  <!-- Entry Script & GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
